name: AxiomPress contracts

on:
    push:
        paths:
            - 'src/axiompress/**'
            - 'tools/axiompress/**'
            - 'tests/axiompress/**'
            - 'composer.json'
            - 'phpcs-axiompress.xml.dist'
            - '.github/workflows/axiompress-contracts.yml'
    pull_request:
        paths:
            - 'src/axiompress/**'
            - 'tools/axiompress/**'
            - 'tests/axiompress/**'
            - 'composer.json'
            - 'phpcs-axiompress.xml.dist'
            - '.github/workflows/axiompress-contracts.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    contracts:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  extensions: pdo_sqlite
                  coverage: none
            - name: Install PHP verification dependencies
              run: composer install --no-interaction --prefer-dist --no-progress
            - name: Independent PHP standards and authority contracts
              run: |
                  composer lint:axiompress
                  composer test:protocol
                  composer test:broker
                  php tests/axiompress/native-core-test.php
                  php tests/axiompress/service-contract-test.php
            - name: Design schemas and rejection corpus
              run: |
                  python3 -m venv .cache/axiompress-ci
                  .cache/axiompress-ci/bin/pip install -r tools/axiompress/experiments/requirements.txt
                  .cache/axiompress-ci/bin/python tests/axiompress/schema-test.py
                  .cache/axiompress-ci/bin/python tests/axiompress/domain-contract-test.py

    database:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: PostgreSQL auth, content, public HTTP and migration boundaries
              run: sudo python3 tools/axiompress/database/run-checks.py
